<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="">
<title>뻐꾸기 휴대폰 참여</title>
<!-- 글꼴은 Pretendard 하나. 못 불러오면 시스템 글꼴로 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<!-- 일행 지도. 못 불러와도 나머지 화면은 그대로 쓴다 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* 색은 이 :root 에만 둔다. 밝은 회색 바탕 위 흰 카드, 회색 글자 단계, 주 색은 주황 */
  :root { --bg:#F2F4F6; --surface:#FFFFFF;
          --grey50:#F9FAFB; --grey200:#E5E8EB; --grey300:#D1D6DB; --grey400:#B0B8C1; --grey500:#8B95A1; --grey600:#6B7684; --grey700:#4E5968; --grey800:#333D4B;
          --text:#191F28; --text2:var(--grey700); --text3:var(--grey600);
          --primary:#7B8EF5; --primary-pressed:#6C7EEA; --primary-weak:#EEF0FF; --primary-ink:#4353D6; --primary-text:#3340B8;
          --danger:#F04452; --danger-weak:#FFEEEE; --danger-ink:#D22030;
          --info:#2F6FE0; --info-weak:#E8F1FF; --info-ink:#1A47B5;
          --c1:#3182F6; --c2:#7B55FF; --c3:#14B8D4; --c4:#FF3D8B; --c5:#FFB331; --c6:#F04452; --c7:#22B866;
          --flag:var(--text);
          /* 스크립트가 카드·호차 색에 쓰는 이름 */
          --brand:var(--primary); --tx:var(--danger); --ink:var(--text);
          --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 500 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  body { padding: 0 20px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; overflow-x: hidden; }
  button, input { font-family: inherit; }

  /* 머리: 내 차 색 막대, 마스코트, 이름, 오른쪽에 방 코드 칩 */
  header { display: flex; align-items: center; gap: 10px; padding: 20px 0 16px; }
  #flag { width: 6px; height: 24px; border-radius: 3px; background: var(--flag); display: none; margin-right: -2px; flex: none; }
  header .cuckoo { width: 40px; height: 40px; padding: 4px; border-radius: 12px; background: var(--surface); }
  header h1 { font: 800 24px/1 var(--font); letter-spacing: -.03em; margin: 0; white-space: nowrap; flex: none; }
  #status { color: var(--text2); font: 600 14px/1.3 var(--font); margin-left: auto; text-align: right; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #status .lcd { padding: 7px 12px; border-radius: 10px; font: 700 15px/1 var(--font); letter-spacing: .04em; display: flex; align-items: center; gap: 7px; white-space: nowrap;
    background: var(--surface); color: var(--text); }
  #status .lcd small { font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--text3); }
  #status .lcd .me { font-size: 13px; font-weight: 700; color: var(--primary-text); background: var(--primary-weak); border-radius: 6px; padding: 3px 6px; letter-spacing: 0; }
  #status svg { width: 17px; height: 13px; color: var(--text2); }
  #status > span:last-child { white-space: nowrap; }
  header:has(.lcd) .cuckoo { display: none; }

  .lcd { background: var(--grey50); color: var(--text); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--grey300); flex: none; }
  .led.rx { background: var(--info); }
  .led.tx { background: var(--primary-ink); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .grille { display: none; }

  /* 마스코트: 부드러운 사각 위에서 살짝 떠 있다 */
  .cuckoo { object-fit: contain; flex: none; animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }

  /* 입장 카드 */
  .radio { background: var(--surface); border-radius: 24px; padding: 20px 20px 24px; margin-top: 4px; }
  .radio .slots { height: 168px; border-radius: 20px; background: var(--primary-weak); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .radio .slots .cuckoo { width: 132px; height: 132px; }
  label { display: block; font: 700 15px/1.4 var(--font); color: var(--text2); margin: 0 0 8px 2px; }
  .chan { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 16px; background: var(--bg); margin-bottom: 20px; }
  .chan b { font-size: 13px; font-weight: 700; color: var(--primary-text); background: var(--primary-weak); border-radius: 10px; padding: 5px 9px; }
  .chan input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: 700 26px/1.1 var(--font);
    letter-spacing: .12em; text-transform: uppercase; padding: 4px 0; }
  .chan input::placeholder { color: var(--grey400); }
  .chan:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
  .chan input:focus { outline: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 0 2px 20px; color: var(--text2); font: 500 14px/1.6 var(--font); }
  .check input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--primary); }

  button { font: 700 16px/1.2 var(--font); border: 0; cursor: pointer; color: var(--text); background: var(--surface); border-radius: 16px; transition: transform .1s, background .15s; }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
  button:disabled { cursor: default; }
  .big { width: 100%; height: 56px; font: 700 17px/1 var(--font); color: var(--text); background: var(--primary); }
  .big:active:not(:disabled) { background: var(--primary-pressed); }
  .big:disabled { background: var(--grey200); color: var(--grey500); }
  .ghost { display: block; width: 100%; margin-top: 10px; padding: 16px; text-align: center; text-decoration: none; font: 700 16px/1.2 var(--font);
    color: var(--text2); background: var(--grey50); border-radius: 16px; }
  .big.ghost { height: 56px; padding: 0; color: var(--primary-text); background: var(--primary-weak); }

  /* 쉬어 가 투표 */
  #vote { display: none; background: var(--surface); border-radius: 24px; padding: 20px; margin: 4px 0 12px; }
  #vote label { display: flex; align-items: center; gap: 8px; margin: 0 0 14px 2px; font: 800 20px/1.3 var(--font); color: var(--text); }
  #vote label .lcd { padding: 4px 10px; border-radius: 10px; font: 700 14px/1.3 var(--font); background: var(--primary-weak); color: var(--primary-text); }
  #vote .opts { display: grid; gap: 8px; }
  #vote button { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; font-size: 17px; text-align: left; background: var(--grey50); }
  #vote button b { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; font: 800 16px/1 var(--font); color: var(--text2); background: var(--grey200); }
  #vote button.mine { background: var(--primary-weak); color: var(--primary-text); }
  #vote button.mine b { background: var(--primary); color: var(--text); }

  /* 일행 지도 */
  #map { height: 260px; border-radius: 24px; background: var(--grey200); z-index: 0; overflow: hidden; }
  #map .leaflet-tile-pane { filter: grayscale(1) brightness(1.05) contrast(.92);  /* 초록 공원색까지 무채색으로 */ }
  #map .leaflet-control-attribution { background: rgba(255,255,255,.85); color: var(--text3); font: 500 10px var(--font); border-radius: 8px 0 0 0; }
  #map .leaflet-control-attribution a { color: var(--text3); }
  .car { display: flex; flex-direction: column; align-items: center; }
  .car b { width: 34px; height: 34px; border-radius: 50% 50% 50% 6px; transform: rotate(-45deg); display: grid; place-items: center;
    border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(0,23,51,.18); font: 800 16px/1 var(--font); }
  .car b i { transform: rotate(45deg); font-style: normal; }
  .car.me b { width: 42px; height: 42px; font-size: 19px; }
  .car span { margin-top: 9px; padding: 2px 9px; border-radius: 8px; font: 700 12px/1.4 var(--font); white-space: nowrap; background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,23,51,.12); }
  .car.me span { background: var(--text); color: #fff; }
  .pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid #fff; background: var(--grey600); color: #fff;
    box-shadow: 0 3px 10px rgba(0,23,51,.18); font: 800 13px/1 var(--font); }
  .pin.brake_hard, .pin.airbag { background: var(--danger); } .pin.rain { background: var(--info); }
  .pin.turn_left, .pin.turn_right { background: var(--primary); } .pin.speed_limit, .pin.caution { background: var(--c3); color: var(--text); }

  /* PTT: 화면 폭 버튼. 누르는 동안 짙은 보라로 "송신 중"과 마이크 미터 */
  #ptt { width: 100%; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 88px; padding: 0 22px; border-radius: 24px;
    background: var(--primary); color: var(--text); user-select: none; -webkit-user-select: none; touch-action: none; }
  #ptt:active:not(:disabled) { background: var(--primary-pressed); }
  #ptt .led { display: none; }
  #ptt .tag { font: 600 15px/1.3 var(--font); color: var(--grey800); order: 2; }
  #ptt .word { font: 800 28px/1 var(--font); letter-spacing: -.02em; white-space: nowrap; order: 1; }
  #ptt .say, #ptt .meter { display: none; }
  #ptt.on { background: var(--primary-ink); color: #fff; justify-content: flex-start; }
  #ptt.on .tag, #ptt.on .word { display: none; }
  #ptt.on .say { display: block; font: 800 26px/1 var(--font); white-space: nowrap; }
  #ptt.on .led { display: block; width: 12px; height: 12px; background: #fff; }
  #ptt.on .meter { display: flex; flex: 1; gap: 3px; height: 30px; align-items: center; margin-left: 8px; }
  .meter i { flex: 1; height: 40%; border-radius: 2px; background: #fff; opacity: .3; }
  .meter i:nth-child(n+6) { height: 60%; } .meter i:nth-child(n+10) { height: 80%; } .meter i:nth-child(n+13) { height: 100%; }
  .meter i.on { opacity: 1; }
  #ptt:disabled { background: var(--grey200); height: 64px; }
  #ptt:disabled .tag { display: none; }
  #ptt:disabled .word { font: 600 15px/1.3 var(--font); letter-spacing: 0; white-space: normal; text-align: center; color: var(--grey600); }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; font: 500 16px var(--font); padding: 0 18px; height: 54px; border-radius: 16px; border: 0; background: var(--surface); color: var(--text); }
  .row input::placeholder { color: var(--grey500); }
  .row input:focus { outline: 0; box-shadow: inset 0 0 0 2px var(--primary); }
  .row button { padding: 0 20px; height: 54px; flex: none; white-space: nowrap; background: var(--primary-weak); color: var(--primary-text); }
  h2 { font: 800 22px/1.3 var(--font); letter-spacing: -.02em; margin: 32px 2px 12px; }
  .note { color: var(--text2); font: 500 14px/1.5 var(--font); margin: 8px 2px 0; }
  .note:empty { display: none; }
  #leave { margin-top: 20px; }

  /* 무전 카드: 흰 둥근 카드. 왼쪽 연한 사각에 마스코트, 위에 RX/TX·보낸 이·시각, 아래 큰 글 */
  #cards { display: grid; gap: 10px; }
  .card { --c: var(--primary); display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: 24px; padding: 16px; }
  .card .face { width: 56px; height: 56px; flex: none; display: grid; place-items: center; border-radius: 16px; background: color-mix(in srgb, var(--c) 12%, #fff); }
  .card .cuckoo { width: 48px; height: 48px; }
  .card .body { flex: 1; min-width: 0; }
  .card .rx { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font: 700 12px/1.2 var(--font); color: var(--text3); }
  .card .rx > * { white-space: nowrap; flex: none; }
  .card .rx > span:first-child { padding: 3px 7px; border-radius: 6px; background: var(--info-weak); color: var(--info-ink); }
  .card .rx > span.tx { background: var(--primary-weak); color: var(--primary-text); }
  /* 호차 이름: 차 색을 옅게 깐 칩에 어두운 글자, 앞에 차 색 점 */
  .card .from { color: var(--text); background: color-mix(in srgb, var(--c) 14%, #fff); border-radius: 6px; padding: 3px 8px 3px 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .card .from::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .card .wave { display: flex; align-items: center; gap: 2px; height: 14px; }
  .card .wave i { width: 3px; border-radius: 2px; background: var(--c); opacity: .6; }
  .card.fresh .wave i { animation: crackle .14s 10; }
  @keyframes crackle { 50% { transform: scaleY(.3); } }
  .card.fresh { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(-6px); opacity: .4; } }
  .card time { margin-left: auto; color: var(--text3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .card .text { font: 700 18px/1.45 var(--font); letter-spacing: -.02em; margin-top: 6px; word-break: keep-all; overflow-wrap: anywhere; }
  .card.alert { background: var(--danger-weak); }
  .card.alert .face { background: #fff; }
  .card.alert .text { color: var(--danger-ink); }
  .card.alert .from { background: #fff; }
  .chip { display: inline-block; border-radius: 6px; padding: 3px 7px; font-weight: 700; color: #5B36E0; background: #F1ECFF; }
  .chip.kids { color: #0A7080; background: #E3F8FB; }

  /* 긴급: 붉은 바탕 위 흰 시트, 큰 빨간 제목, 아래 어두운 확인 버튼 */
  #sos { position: fixed; inset: 0; background: var(--danger-weak); display: none; flex-direction: column; justify-content: flex-end;
    padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); z-index: 1000; gap: 12px; }
  #sos .cuckoo { width: 120px; height: 120px; padding: 10px; align-self: center; border-radius: 28px; background: var(--surface); margin-bottom: auto; margin-top: auto; }
  #sos .head { display: flex; align-items: center; gap: 10px; font: 800 32px/1.2 var(--font); letter-spacing: -.03em; color: var(--danger-ink); padding: 0 4px; }
  #sos .led { width: 12px; height: 12px; background: var(--danger); animation: blink 1s infinite; }
  #sos .lcd { background: var(--surface); color: var(--text); border-radius: 24px; padding: 20px; }
  #sos .lcd b { display: inline-block; font: 700 13px/1.3 var(--font); color: var(--danger-ink); background: var(--danger-weak); border-radius: 8px; padding: 4px 10px; margin-bottom: 10px; }
  #sos p { font: 700 20px/1.45 var(--font); letter-spacing: -.02em; margin: 0; color: var(--text); word-break: keep-all; }
  #sos button { height: 56px; font: 700 17px/1 var(--font); background: var(--text); color: #fff; }
  @media (prefers-reduced-motion: reduce) { .led.tx, #sos .led, .cuckoo, .card.fresh, .card.fresh .wave i { animation: none; } }

  /* 색 고르기 칩 */
  .clr-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .clr-chip { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 0; display: grid; place-items: center; background: var(--chip, var(--grey200)); cursor: pointer; flex: none; transition: transform .1s; -webkit-appearance: none; }
  .clr-chip:active { transform: scale(.93); }
  .clr-chip[data-idx="-1"] { background: var(--grey200); font: 700 11px/1 var(--font); color: var(--text2); width: auto; min-width: 44px; padding: 0 12px; border-radius: 22px; }
  .clr-chip[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--chip, var(--grey400)); }
  .clr-chip[data-idx="-1"][aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--grey500); }
  .clr-bird { width: 30px; height: 30px; object-fit: contain; display: block; }
</style>
</head>
<body>
<header>
  <span id="flag"></span>
  <img class="cuckoo" src="/cuckoo/base.png" alt="">
  <h1>뻐꾸기</h1>
  <span id="status">휴대폰으로 함께 가기</span>
</header>

<section id="join" class="radio">
  <div class="slots"><img class="cuckoo" data-mood="wait" alt=""></div>
  <label for="code">받은 방 코드</label>
  <div class="lcd chan"><b>CH</b><input id="code" type="text" inputmode="text" autocomplete="off" maxlength="8" placeholder="ABC234"></div>
  <label class="check"><input id="agree" type="checkbox">
    <span>방에 있는 동안 휴대폰 위치를 일행과 나누는 데 동의합니다. 방을 나가면 위치를 보내지 않습니다.</span></label>
  <div style="margin: 0 2px 20px;">
    <label style="margin-bottom:10px;">우리 차 뻐꾸기 색</label>
    <div class="clr-row" role="group" aria-label="뻐꾸기 색 선택">
      <button type="button" class="clr-chip" data-idx="-1" aria-pressed="true">자동</button>
      <button type="button" class="clr-chip" data-idx="0" aria-pressed="false" style="--chip:#3182F6"><img class="clr-bird" alt="파랑"></button>
      <button type="button" class="clr-chip" data-idx="1" aria-pressed="false" style="--chip:#7B55FF"><img class="clr-bird" alt="보라"></button>
      <button type="button" class="clr-chip" data-idx="2" aria-pressed="false" style="--chip:#14B8D4"><img class="clr-bird" alt="하늘"></button>
      <button type="button" class="clr-chip" data-idx="3" aria-pressed="false" style="--chip:#FF3D8B"><img class="clr-bird" alt="분홍"></button>
      <button type="button" class="clr-chip" data-idx="4" aria-pressed="false" style="--chip:#FFB331"><img class="clr-bird" alt="노랑"></button>
      <button type="button" class="clr-chip" data-idx="5" aria-pressed="false" style="--chip:#F04452"><img class="clr-bird" alt="빨강"></button>
      <button type="button" class="clr-chip" data-idx="6" aria-pressed="false" style="--chip:#22B866"><img class="clr-bird" alt="초록"></button>
    </div>
  </div>
  <button id="go" class="big" disabled>들어가기</button>
  <button id="fleet" class="big ghost" style="display:none">운수사 방 새로 만들기</button>
</section>

<section id="room" style="display:none">
  <section id="vote">
    <label>쉬어 가 투표 <span class="lcd" id="left"></span></label>
    <div class="opts" id="opts"></div>
  </section>
  <div id="map"></div>
  <button id="ptt"><span class="grille"></span><span class="led" id="pttLed"></span><span class="tag">누르고 말하기</span><span class="word">무전</span><span class="meter" id="meter"></span><span class="say">송신 중</span></button>
  <div class="note" id="heard"></div>
  <div class="row">
    <input id="text" type="text" placeholder="글로 보내기" maxlength="200">
    <button id="send">보내기</button>
  </div>
  <a id="report" class="ghost" target="_blank" rel="noopener" style="display:none">차량별 운행 보고서 열기</a>
  <h2>무전</h2>
  <div id="cards"><div class="note">일행의 자동 콜과 무전이 여기에 뜹니다.</div></div>
  <button id="leave" class="ghost">나가기</button>
</section>

<section id="sos"><img class="cuckoo" data-mood="emergency" alt="">
  <div class="head"><span class="led"></span>긴급 콜</div>
  <div class="lcd"><b id="sosHead">EMERGENCY</b><p id="sosText"></p></div>
  <button id="sosOk">확인</button></section>

<script>
const $ = id => document.getElementById(id);

// 팔레트 7색. 고른 색만 인정하고 서버 기본색은 null(번호순) 처리
const PAL = ['#3182F6','#7B55FF','#14B8D4','#FF3D8B','#FFB331','#F04452','#22B866'];
function colorIndex(hex) {
  if (!hex) return null;
  const i = PAL.findIndex(c => c.toUpperCase() === hex.toUpperCase());
  return i >= 0 ? i : null;
}

// 고른 색 순번(-1=자동). localStorage에서 복원
let chosenIdx = -1;
try { const v = localStorage.getItem('cuckooColor'); if (v !== null) chosenIdx = parseInt(v, 10); } catch {}

// 상단 막대 색은 바탕색 토큰을 따른다
document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
const CODE_RE = /^[A-HJ-NP-Z2-9]{6,8}$/;
let ws = null, me = null, last = null, watch = null, posTimer = null, vote = null, voteTimer = null, retry = 0, code = null;

// 주소에 ?code=ABC234 가 있으면 미리 넣는다
$('code').value = new URLSearchParams(location.search).get('code') || '';
// /control 은 운수사 관제석: 차로 세지 않고 위치를 보내지 않는다. 관제 키는 주소 # 뒤에 둔다(서버로 가지 않게)
const CONTROL = location.pathname === '/control';
let controlKey = new URLSearchParams(location.hash.slice(1)).get('key') || '';
if (CONTROL) {
  $('status').textContent = '운수사 관제석';
  $('agree').closest('label').style.display = 'none';
  $('fleet').style.display = 'block';
  $('go').textContent = '관제석으로 들어가기';
}
const ready = () => { $('go').disabled = !(CODE_RE.test($('code').value.trim().toUpperCase()) && (CONTROL ? controlKey : $('agree').checked)); };
$('code').oninput = ready; $('agree').onchange = ready; ready();

$('fleet').onclick = async () => {
  const r = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fleet: true }) });
  const j = await r.json();
  controlKey = j.controlKey;
  $('code').value = j.code;
  history.replaceState(null, '', `/control?code=${j.code}#key=${controlKey}`);
  ready();
};

$('go').onclick = () => { code = $('code').value.trim().toUpperCase(); if (!CONTROL) startGps(); connect(); };
$('leave').onclick = () => { code = null; ws?.close(); stopGps(); location.reload(); };

// 다시 붙을 때 같은 호차로 앉도록 서버가 준 재입장 토큰을 방마다 들고 있는다
function savedToken() { try { return sessionStorage.getItem(`token:${code}`) || undefined; } catch { return undefined; } }

function connect() {
  if (!code) return;
  $('status').textContent = '연결 중…';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/rooms/${code}/ws`);
  ws.onopen = () => {
    retry = 0;
    const flagColor = chosenIdx >= 0 ? PAL[chosenIdx] : undefined;
    const helloMsg = CONTROL
      ? { type: 'hello', role: 'control', key: controlKey }
      : { type: 'hello', nickname: '휴대폰', seats: [{ id: 'driver', occupied: true }], token: savedToken(), ...(flagColor ? { flagColor } : {}) };
    ws.send(JSON.stringify(helloMsg));
  };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
  ws.onclose = () => {
    if (!code) return;
    const d = Math.min(30, 2 ** retry++);
    $('status').textContent = `끊김, ${d}초 뒤 다시 연결`;
    setTimeout(connect, d * 1000);
  };
}

function send(o) { if (ws?.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }

// --- 위치: 2초마다 마지막 값 ---
function startGps() {
  if (!navigator.geolocation) return card('뻐꾸기', '이 브라우저는 위치를 쓸 수 없습니다', true);
  watch = navigator.geolocation.watchPosition(p => {
    last = { lat: p.coords.latitude, lng: p.coords.longitude, heading: p.coords.heading || 0, speed: (p.coords.speed || 0) * 3.6 };
    if (me) drawMap();
  }, err => card('뻐꾸기', `위치를 받지 못했습니다: ${err.message}`, true), { enableHighAccuracy: true });
  posTimer = setInterval(() => last && send({ type: 'pos', ...last }), 2000);
}
function stopGps() { if (watch != null) navigator.geolocation.clearWatch(watch); clearInterval(posTimer); }

// --- 받은 메시지 ---
// 서버 logic.js distText·앱 Phrase.distance 와 같다
const dist = m => m < 1000 ? `${Math.floor(m / 100) * 100}m` : m < 10000 ? `${(Math.round(m / 100) / 10).toFixed(1).replace(/\.0$/, '')}km` : `${Math.round(m / 1000)}km`;
// 앱 Phrase.signal 과 같은 문장. where 는 "1.2km 앞"
function signalText(m, where) {
  const d = m.distanceM != null ? `${dist(m.distanceM)} 앞 ` : '';
  switch (m.kind) {
    case 'brake_hard': return [m.from, where].filter(Boolean).join(', ') + ' 급제동, 감속하세요';
    case 'rain': return [m.from, where && `${where}부터`].filter(Boolean).join(', ') + ' 비';
    case 'turn_left': case 'turn_right': return `선두, ${d}${m.kind === 'turn_left' ? '좌회전' : '우회전'}`;
    case 'speed_limit': return `선두, 제한속도 ${m.value ?? '?'}으로 바뀜`;
    case 'caution': return `선두, ${d}주의 구간`;
    case 'airbag': return `긴급, ${m.from} 에어백 전개` + (where ? `, ${where}` : '');
  }
  return `${m.from} ${m.kind}`;
}
function haversine(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 12_742_000 * Math.asin(Math.sqrt(x));
}

function onMsg(m) {
  switch (m.type) {
    case 'welcome':
      me = m.carLabel;
      if (m.token) try { sessionStorage.setItem(`token:${code}`, m.token); } catch {}
      (m.cars || []).forEach(c => { cars[c.from] = { color: c.flagColor, lat: c.lat, lng: c.lng }; });
      // 내 차도 cars에 넣어 carColor가 올바른 색을 쓰게 한다
      if (m.flagColor && m.carLabel) cars[m.carLabel] = { ...cars[m.carLabel], color: m.flagColor };
      setTimeout(() => { map?.invalidateSize(); drawMap(); }, 0);
      $('join').style.display = 'none'; $('room').style.display = 'block';
      if (m.role === 'control') {
        $('report').href = `/api/rooms/${code}/report?key=${encodeURIComponent(controlKey)}`;
        $('report').style.display = 'block';
        card('관제', `기사들에게 방 코드 ${code}를 알려 주세요. 관제석은 차로 세지 않습니다`, false, 'all', 'base');
      }
      showChannel();
      if (m.carNum) { document.documentElement.style.setProperty('--flag', carColor(m.carNum)[0]); $('flag').style.display = 'block'; }
      // 머리말 마스코트를 내 호차 색으로
      if (m.flagColor) moodImg(document.querySelector('header .cuckoo'), 'base', m.flagColor);
      break;
    case 'hello': cars[m.from] = { ...cars[m.from], color: m.flagColor }; drawMap(); showChannel(); break;
    case 'pos': cars[m.from] = { ...cars[m.from], lat: m.lat, lng: m.lng }; drawMap(); break;
    case 'leave': delete cars[m.from]; drawMap(); showChannel(); break;
    case 'signal': {
      // 서버가 받는 쪽 기준 거리·앞뒤(gapM, ahead)를 붙여 준다. 없으면 직접 잰 거리만
      const where = m.gapM != null ? `${dist(m.gapM)} ${m.ahead ? '앞' : '뒤'}`
        : last && m.lat != null ? `${dist(haversine(last.lat, last.lng, m.lat, m.lng))} 거리` : '';
      const text = signalText(m, where);
      card(m.from, text, m.kind === 'brake_hard' || m.kind === 'airbag', 'all',
        { brake_hard: 'brake', airbag: 'emergency', rain: 'rain', speed_limit: 'camera', caution: 'camera' }[m.kind] || 'rx');
      if (m.lat != null) addPin(m.kind, m.from, m.lat, m.lng);
      if (m.kind === 'airbag') {
        $('sosHead').textContent = `EMERGENCY · ${m.from} 에어백`;
        $('sosText').textContent = text + (m.lat != null ? ` (${m.lat.toFixed(4)}, ${m.lng.toFixed(4)})` : '');
        $('sos').style.display = 'flex';
      }
      speak(text);
      break;
    }
    case 'notice':
      card('위치', m.text, m.kind === 'fall_behind' || m.kind === 'long_stop', 'all',
        { fall_behind: 'lost', long_stop: 'alert', place: 'arrive' }[m.kind] || 'base');
      speak(m.text);
      if (m.kind === 'fall_behind' && m.lat != null) addPin(m.kind, m.target, m.lat, m.lng);
      break;
    case 'say':
      card(m.system ? '꼬리 콜' : m.from === 'server' ? '뻐꾸기' : m.from + (m.speaker ? ` ${m.speaker}` : ''), m.text, false, m.channel, m.system ? 'alert' : m.channel === 'kids' ? 'kids' : m.from === me ? 'tx' : 'rx');
      if (m.from !== me) speak(`${m.from === 'server' ? '뻐꾸기' : m.from}, ${m.text}`);
      break;
    case 'roll': {
      const on = (m.seats || []).filter(s => s.occupied).length;
      card(m.from, `점호: ${on}명`, false, 'all', 'rollcall');
      break;
    }
    case 'route': card(m.from, `대장 콜: ${m.dest?.name || '목적지'}로 경로를 바꿨습니다`, false, 'all', 'rx'); speak(`선두가 ${m.dest?.name || '목적지'}로 경로를 바꿨습니다`); break;
    case 'vote_open': if (CONTROL) card('쉬어 가', '기사들이 휴게소 투표 중', false, 'all', 'vote'); else openVote(m); break;
    case 'vote_result':
      closeVote();
      card('쉬어 가', `${m.winner.name}, 총 ${m.totalPeople}명`, false, 'all', 'rest');
      speak(`${m.winner.name}, 총 ${m.totalPeople}명`);
      break;
    case 'arrive': card('뻐꾸기', '일행이 모두 도착했습니다', false, 'all', 'arrive'); speak('일행이 모두 도착했습니다'); break;
    case 'error': card('서버', m.error, true); break;
  }
}

// 마스코트 그림: 상황별 PNG. wait·emergency·lost는 같은 이름 파일이 생겼으니 직접 쓴다
const MOOD_FILE = { tx: 'talk', brake: 'alert', camera: 'alert', rain: 'base', rx: 'rx', vote: 'vote', arrive: 'arrive' };

// RGB ↔ HSV 변환
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if (d > 0) {
    if (max === r) h = ((g - b) / d + 6) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, max > 0 ? d / max : 0, max];
}
function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) [r,g,b] = [c,x,0]; else if (h < 120) [r,g,b] = [x,c,0];
  else if (h < 180) [r,g,b] = [0,c,x]; else if (h < 240) [r,g,b] = [0,x,c];
  else if (h < 300) [r,g,b] = [x,0,c]; else [r,g,b] = [c,0,x];
  return [(r+m)*255|0, (g+m)*255|0, (b+m)*255|0];
}

// 표정+색 조합 캐시. 비동기 로드 중에도 Promise를 넣어 중복 요청을 막는다
const imgCache = new Map();
function recolorCuckoo(src, hex) {
  const key = `${src}:${hex}`;
  if (imgCache.has(key)) return imgCache.get(key);
  const p = new Promise(resolve => {
    const image = new Image(); image.crossOrigin = 'anonymous';
    image.onload = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = image.width; cv.height = image.height;
        const ctx = cv.getContext('2d');
        ctx.drawImage(image, 0, 0);
        const id = ctx.getImageData(0, 0, cv.width, cv.height), d = id.data;
        const tr = parseInt(hex.slice(1,3),16), tg = parseInt(hex.slice(3,5),16), tb = parseInt(hex.slice(5,7),16);
        const [th, ts, tv] = rgbToHsv(tr, tg, tb);
        const yellowTarget = th > 20 && th < 60;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i+3] < 10) continue;
          const [h, s, v] = rgbToHsv(d[i], d[i+1], d[i+2]);
          if (h > 205 && h < 262 && s > 0.18 && v > 0.3) {
            // 몸통(연보라 계열)을 목표 색으로 옮긴다
            const [nr,ng,nb] = hsvToRgb(th, Math.min(1, s*ts/0.53), Math.min(1, v*tv/0.95));
            d[i] = nr; d[i+1] = ng; d[i+2] = nb;
          } else if (yellowTarget && h > 15 && h < 55 && s > 0.5 && v > 0.5) {
            // 노랑 차: 부리·발·무전기가 몸통에 묻히지 않게 주황으로 내린다
            const [nr,ng,nb] = hsvToRgb(14, s, v*0.92);
            d[i] = nr; d[i+1] = ng; d[i+2] = nb;
          }
        }
        ctx.putImageData(id, 0, 0);
        resolve(cv.toDataURL());
      } catch { resolve(null); }
    };
    image.onerror = () => resolve(null);
    image.src = src;
  });
  imgCache.set(key, p);
  return p;
}

async function moodImg(img, m, hex) {
  const file = MOOD_FILE[m] || m;
  const src = `/cuckoo/${file}.png`;
  if (hex) {
    const url = await recolorCuckoo(src, hex);
    img.src = url || src; // 색 바꾸기 실패시 원본
  } else {
    img.src = src;
  }
}
document.querySelectorAll('img[data-mood]').forEach(i => moodImg(i, i.dataset.mood));

// 호차 색 [바탕 hex, 글자]: cars에 저장된 flagColor를 먼저 쓰고 없으면 번호순
const carColor = n => {
  const ci = colorIndex(cars[`${n}호차`]?.color);
  const idx = ci !== null ? ci : (n - 1) % 6;
  // 노랑(4번)·초록(6번) 위에는 어두운 글자가 필요하다
  return [PAL[idx], (idx === 4 || idx === 6) ? 'var(--ink)' : '#fff'];
};
function card(from, text, alert = false, channel = 'all', mood = null) {
  const c = document.createElement('div');
  c.className = 'card fresh' + (alert ? ' alert' : '');
  setTimeout(() => c.classList.remove('fresh'), 1500);
  mood ??= alert ? 'alert' : channel === 'kids' ? 'kids' : 'base';
  const n = parseInt(from);
  c.style.setProperty('--c', alert ? 'var(--tx)' : n > 0 ? carColor(n)[0] : channel === 'kids' ? 'var(--c6)' : 'var(--brand)');
  const t = new Date().toTimeString().slice(0, 8);
  const chip = channel && channel !== 'all' ? `<span class="chip${channel === 'kids' ? ' kids' : ''}">${channel === 'kids' ? '키즈' : '어른'} 채널</span>` : '';
  const wave = Array.from({ length: 6 }, () => `<i style="height:${30 + Math.random() * 70}%"></i>`).join('');
  c.innerHTML = `<div class="face"><img class="cuckoo" alt=""></div><div class="body"><div class="rx"><span${mood === 'tx' ? ' class="tx"' : ''}>${mood === 'tx' ? 'TX' : 'RX'}</span><span class="from${!alert && n > 0 && carColor(n)[1] !== '#fff' ? ' dark' : ''}"></span>${chip}<span class="wave">${wave}</span><time>${t}</time></div><div class="text"></div></div><i class="grille"></i>`;
  // 무전 카드: 보낸 쪽이 N호차면 그 호차 색으로 마스코트를 칠한다
  const fromColor = !alert && n > 0 ? (cars[`${n}호차`]?.color || null) : null;
  moodImg(c.querySelector('img'), mood, fromColor);
  c.querySelector('.from').textContent = from;   // 받은 글은 textContent 로만 넣는다
  c.querySelector('.text').textContent = text;
  const box = $('cards');
  if (box.firstElementChild?.classList.contains('note')) box.innerHTML = '';
  box.prepend(c);
  while (box.children.length > 50) box.lastElementChild.remove();
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR';
  speechSynthesis.speak(u);
}

// --- 일행 지도: 손대지 않아도 일행이 다 들어오게 맞춘다 ---
const PIN_TTL_MS = 5 * 60_000;
// 핀 글자. 색은 CSS .pin.<kind>
const PIN = { brake_hard: '급', rain: '비', turn_left: '좌', turn_right: '우', speed_limit: '속', caution: '주', airbag: '!', fall_behind: '이' };
let cars = {}, pins = [], map = null, carLayer = null, pinLayer = null;
if (window.L) {
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView([37.454, 127.043], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '&copy; OpenStreetMap' }).addTo(map);
  carLayer = L.layerGroup().addTo(map); pinLayer = L.layerGroup().addTo(map);
  setInterval(drawMap, 10_000); // 오래된 핀을 지운다
} else $('map').style.display = 'none';

function addPin(kind, from, lat, lng) { pins.push({ kind, from, lat, lng, at: Date.now() }); drawMap(); }

function drawMap() {
  if (!map) return;
  pins = pins.filter(p => Date.now() - p.at < PIN_TTL_MS);
  pinLayer.clearLayers(); carLayer.clearLayers();
  const pts = []; // 차와 이슈 핀이 모두 들어오게 맞춘다
  for (const p of pins) {
    pts.push([p.lat, p.lng]);
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="pin ${p.kind}">${PIN[p.kind] || '?'}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) }).addTo(pinLayer);
  }
  // 물방울 핀: 끝이 좌표를 가리킨다
  const put = (label, num, lat, lng, mine) => {
    pts.push([lat, lng]);
    const [bg, fg] = carColor(num);
    const html = `<div class="car${mine ? ' me' : ''}"><b style="background:${bg};color:${fg}"><i>${num}</i></b><span>${mine ? '나 · ' + label : label}</span></div>`;
    L.marker([lat, lng], { zIndexOffset: mine ? 1000 : 500, icon: L.divIcon({ className: '', html, iconSize: [80, 70], iconAnchor: [40, mine ? 51 : 42] }) }).addTo(carLayer);
  };
  for (const [label, c] of Object.entries(cars)) if (label !== me && c.lat != null) put(label, parseInt(label), c.lat, c.lng, false);
  if (last && me) put(me, parseInt(me), last.lat, last.lng, true);
  if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
  else if (pts.length === 1) map.setView(pts[0], 14);
}

// --- 쉬어 가 ---
function openVote(m) {
  vote = { deadline: Date.now() + (m.timeoutMs || 30000), mine: null };
  const box = $('opts'); box.innerHTML = '';
  m.candidates.forEach((c, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<b>${i + 1}</b>`; b.append(c.name);
    b.onclick = () => { if (vote.mine == null && send({ type: 'vote', choice: i })) { vote.mine = i; b.classList.add('mine'); } };
    box.append(b);
  });
  $('vote').style.display = 'block';
  clearInterval(voteTimer);
  voteTimer = setInterval(() => { $('left').textContent = `${Math.max(0, Math.round((vote.deadline - Date.now()) / 1000))}초`; }, 500);
  card('쉬어 가', '투표를 엽니다. ' + m.candidates.map((c, i) => `${i + 1}번 ${c.name}`).join(', '), false, 'all', 'vote');
}
function closeVote() { clearInterval(voteTimer); $('vote').style.display = 'none'; vote = null; }

// --- 받아 적기: 누르는 동안 듣고 떼면 보낸다 ---
function say(text) {
  text = text.trim(); if (!text) return;
  const n = text.match(/([1-3]|일|이|삼)\s*번/);
  if (vote && vote.mine == null && n) {
    const i = { '일': 0, '이': 1, '삼': 2 }[n[1]] ?? Number(n[1]) - 1;
    const b = $('opts').children[i];
    if (b) return b.click();
  }
  send({ type: 'say', text: text.length > 40 ? (text.match(/^[^.?!\n]+[.?!]/)?.[0] || text) : text, channel: 'all', seat: 'driver', speaker: '휴대폰' });
}
$('send').onclick = () => { say($('text').value); $('text').value = ''; };
$('text').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = '';
if (!SR) { $('ptt').disabled = true; $('ptt').querySelector('.word').textContent = '음성 인식 없음 · 글로 보내기'; }
function pttDown(e) {
  e.preventDefault();
  if (!SR || rec) return;
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; heard = '';
  rec.onresult = ev => { heard = Array.from(ev.results).map(r => r[0].transcript).join(''); $('heard').textContent = heard; };
  rec.onerror = ev => { $('heard').textContent = `음성 인식 오류: ${ev.error}`; };
  rec.onend = () => { say(heard); rec = null; $('ptt').classList.remove('on'); $('pttLed').className = 'led'; stopMeter(); };
  rec.start();
  $('ptt').classList.add('on'); $('pttLed').className = 'led tx'; startMeter();
}
function pttUp() { rec?.stop(); }
$('ptt').addEventListener('pointerdown', pttDown);
$('ptt').addEventListener('pointerup', pttUp);
$('ptt').addEventListener('pointercancel', pttUp);
$('ptt').addEventListener('pointerleave', pttUp);

// 마이크 크기 미터: 누르는 동안만 마이크를 따로 열어 잰다. 못 열면 미터만 빈 채로 둔다
$('meter').innerHTML = '<i></i>'.repeat(16);
let meterStop = null;
async function startMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize), bars = [...$('meter').children];
    let raf;
    const tick = () => {
      an.getByteTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + ((v - 128) / 128) ** 2, 0) / buf.length);
      const n = Math.min(16, Math.round(rms * 64));
      bars.forEach((b, i) => b.classList.toggle('on', i < n));
      raf = requestAnimationFrame(tick);
    };
    tick();
    meterStop = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); ac.close(); bars.forEach(b => b.classList.remove('on')); };
  } catch { meterStop = null; }
}
function stopMeter() { meterStop?.(); meterStop = null; }

// 머리의 방 코드 칩: 방 코드, 신호 막대, 일행 수 칸
function showChannel() {
  const n = Object.keys(cars).filter(k => k !== me).length + 1;
  const on = ws?.readyState === 1;
  const bars = [0, 1, 2, 3].map(i => `<rect x="${i * 5.5}" y="${12 - i * 4}" width="4" height="${4 + i * 4}" fill="currentColor" opacity="${on ? 1 : (i < 1 ? 1 : .25)}"/>`).join('');
  // 좁은 화면이라 일행 수 대신 우리 호차를 방 코드 칩 안에 둔다(일행 수는 지도에서 보인다)
  $('status').innerHTML = `<span class="led${on ? ' rx' : ''}"></span><span class="lcd"><small>CH</small>${code}<svg viewBox="0 0 22 16" aria-hidden="true">${bars}</svg><span class="me"></span></span>`;
  $('status').querySelector('.me').textContent = me || `${n}대`;
}

$('sosOk').onclick = () => { $('sos').style.display = 'none'; };

// 색 고르기 칩 초기화
function updateJoinMascot() {
  const img = document.querySelector('#join .slots .cuckoo');
  if (!img) return;
  moodImg(img, 'wait', chosenIdx >= 0 ? PAL[chosenIdx] : null);
}

function initColorPicker() {
  const chips = document.querySelectorAll('.clr-chip');
  chips.forEach(btn => {
    const i = parseInt(btn.dataset.idx, 10);
    btn.setAttribute('aria-pressed', String(i === chosenIdx));
    // 색 칩 안에 그 색으로 칠한 뻐꾸기 그림 넣기
    const img = btn.querySelector('.clr-bird');
    if (img && i >= 0) moodImg(img, 'base', PAL[i]);
  });
  updateJoinMascot();
  chips.forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.idx, 10);
      chosenIdx = i;
      try { localStorage.setItem('cuckooColor', String(i)); } catch {}
      chips.forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
      updateJoinMascot();
    };
  });
}
initColorPicker();
