<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="">
<title>뻐꾸기 휴대폰 참여</title>
<!-- 글꼴은 Pretendard 하나. 제목·브랜드·무전 버튼은 굵게(--serif 는 옛 이름으로 남은 제목용 변수). 못 불러오면 아래 대체 글꼴로 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<!-- 일행 지도. 못 불러와도 나머지 화면은 그대로 쓴다 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* 색은 이 :root 에만 둔다. 따뜻한 종이 바탕 위 둥근 핀 카드, 무전기 단서는 어두운 LCD·LED·스피커 그릴·주황 PTT */
  :root { --bg:#fffaf6; --paper:#fff; --line:#f1e6df; --ink:#2a2230; --ink2:#6e6170; --ink3:#ab9ca8;
          --lcd:#2a2230; --lcd-ink:#ffe9a3; --lcd-dim:#a48f73; --grille:#4a3f50;
          --tx:#ff3d5a; --tx-ink:#c21535; --rx:#2b8cff; --brand:#ff7a1a; --brand-hi:#ff9a4a;
          --c1:#ff5a4e; --c2:#2b8cff; --c3:#ffbf1f; --c4:#7b55ff; --c5:#ff3d8b; --c6:#14b8d4;
          --flag:var(--ink); --shadow:0 10px 26px rgba(80,40,60,.10);
          --serif:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
          --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; overflow-x: hidden; }
  button, input { font-family: inherit; }

  /* 무전기 머리: 안테나(내 차 색), 마스코트, 이름, 오른쪽에 채널 LCD */
  header { display: flex; align-items: center; gap: 10px; padding: 18px 0 14px; }
  #flag { width: 6px; height: 26px; border-radius: 3px; background: var(--flag); display: none; transform: translateY(-8px); margin-right: -4px; flex: none; }
  header .cuckoo { width: 38px; height: 38px; }
  header h1 { font: 700 26px/1 var(--serif); letter-spacing: -.03em; margin: 0; white-space: nowrap; flex: none; }
  #status { color: var(--ink2); font: 600 14px/1.3 var(--sans); margin-left: auto; text-align: right; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #status .lcd { padding: 7px 12px; border-radius: 14px; font: 800 15px/1 var(--sans); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #status .lcd small { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--lcd-dim); }
  #status .lcd .me { font-size: 12px; font-weight: 700; color: var(--lcd-dim); letter-spacing: 0; }
  #status svg { width: 19px; height: 14px; }
  #status > span:last-child { white-space: nowrap; }
  header:has(.lcd) .cuckoo { display: none; }

  .lcd { background: var(--lcd); color: var(--lcd-ink); box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 6px 16px rgba(42,34,48,.18); }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .led.rx { background: var(--rx); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rx) 22%, transparent), 0 0 10px var(--rx); }
  .led.tx { background: var(--tx); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tx) 25%, transparent), 0 0 10px var(--tx); animation: blink .84s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  /* 스피커 그릴: 작은 점 무늬 */
  .grille { background: radial-gradient(circle, var(--line) 2.5px, transparent 3px) 0 0 / 10px 10px; }

  /* 입장: 둥근 무전기 앞면 카드 */
  .radio { background: var(--paper); border: 1.5px solid var(--line); border-radius: 32px; box-shadow: var(--shadow); padding: 16px 18px 20px; margin-top: 4px; }
  .radio .slots { height: 156px; border-radius: 24px; background: #fff1e6; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 18px; }
  .radio .slots .cuckoo { width: 124px; height: 124px; }
  .radio .slots::after { content: ""; position: absolute; right: 16px; bottom: 14px; width: 60px; height: 20px;
    background: radial-gradient(circle, #f3d9c6 2.5px, transparent 3px) 0 0 / 10px 10px; }
  label { display: block; font: 700 19px/1.4 var(--serif); margin: 0 0 10px 4px; }
  .chan { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 20px; }
  .chan b { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--lcd-dim); }
  .chan input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--lcd-ink); font: 800 28px/1.1 var(--sans);
    letter-spacing: .14em; text-transform: uppercase; padding: 4px 0; }
  .chan input::placeholder { color: var(--lcd-dim); opacity: .6; }
  .chan:focus-within { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 3px; }
  .chan input:focus { outline: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 18px 4px; color: var(--ink2); font: 500 14px/1.55 var(--sans); }
  .check input { width: 22px; height: 22px; flex: none; margin: 1px 0 0; accent-color: var(--brand); }

  button { font: 700 16px/1.2 var(--sans); border: 0; cursor: pointer; color: var(--ink); background: var(--paper); border-radius: 999px;
    transition: transform .08s, box-shadow .15s, background .15s; }
  button:active:not(:disabled) { transform: translateY(2px) scale(.99); }
  button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
  button:disabled { cursor: default; }
  .big { width: 100%; height: 60px; font: 700 21px/1 var(--serif); letter-spacing: .04em; color: #fff;
    background: linear-gradient(180deg, var(--brand-hi), var(--brand)); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 8px 20px color-mix(in srgb, var(--brand) 35%, transparent); }
  .big:disabled { background: var(--line); color: var(--ink2); box-shadow: none; }
  .ghost { display: block; width: 100%; margin-top: 12px; padding: 14px; text-align: center; text-decoration: none; font: 700 16px/1.2 var(--sans);
    color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; }
  .big.ghost { height: 56px; padding: 0; box-shadow: none; }

  /* 쉬어 가 투표 */
  #vote { display: none; background: var(--paper); border: 2px solid var(--brand); border-radius: 28px; box-shadow: var(--shadow); padding: 16px; margin: 4px 0 16px; }
  #vote label { display: flex; align-items: center; gap: 10px; margin: 0 0 12px 4px; }
  #vote label .lcd { padding: 4px 12px; border-radius: 12px; font: 800 16px/1.3 var(--sans); }
  #vote .opts { display: grid; gap: 10px; }
  #vote button { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; font-size: 17px; text-align: left; border: 1.5px solid var(--line); background: var(--bg); }
  #vote button b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 800 17px/1 var(--sans); color: #fff; background: var(--c2); }
  #vote button:nth-child(2) b { background: var(--c5); } #vote button:nth-child(3) b { background: var(--c4); }
  #vote button.mine { background: var(--brand); border-color: var(--brand); color: #fff; }
  #vote button.mine b { background: #fff; color: var(--brand); }

  /* 일행 지도 */
  #map { height: 260px; border-radius: 28px; border: 1.5px solid var(--line); background: #fbf1e8; z-index: 0; overflow: hidden; }
  #map .leaflet-tile-pane { filter: grayscale(1) sepia(.3) brightness(1.06) contrast(.9);  /* 초록 공원색까지 따뜻한 무채색으로 */ }
  #map .leaflet-control-attribution { background: rgba(255,255,255,.8); color: var(--ink2); font: 500 10px var(--sans); border-radius: 10px 0 0 0; }
  #map .leaflet-control-attribution a { color: var(--ink2); }
  .car { display: flex; flex-direction: column; align-items: center; }
  .car b { width: 34px; height: 34px; border-radius: 50% 50% 50% 6px; transform: rotate(-45deg); display: grid; place-items: center;
    border: 2.5px solid #fff; box-shadow: 0 6px 14px rgba(42,34,48,.25); font: 800 16px/1 var(--sans); }
  .car b i { transform: rotate(45deg); font-style: normal; }
  .car.me b { width: 42px; height: 42px; font-size: 19px; }
  .car span { margin-top: 9px; padding: 2px 9px; border-radius: 999px; font: 800 12px/1.4 var(--sans); white-space: nowrap; background: #fff; color: var(--ink); box-shadow: 0 3px 8px rgba(42,34,48,.14); }
  .car.me span { background: var(--ink); color: #fff; }
  .pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid #fff; background: var(--ink2); color: #fff;
    box-shadow: 0 4px 10px rgba(42,34,48,.25); font: 800 13px/1 var(--sans); }
  .pin.brake_hard, .pin.airbag { background: var(--tx); } .pin.rain { background: var(--rx); }
  .pin.turn_left, .pin.turn_right { background: var(--brand); } .pin.speed_limit, .pin.caution { background: var(--c3); color: var(--ink); }

  /* PTT: 어두운 둥근 판, 스피커 그릴, 큰 주황 알약 버튼. 누르는 동안 빨간 TX 와 마이크 미터 */
  #ptt { width: 100%; margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; border-radius: 32px;
    background: var(--ink); color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 10px 24px rgba(42,34,48,.22); }
  #ptt .grille { width: 30px; height: 50px; flex: none; background: radial-gradient(circle, var(--grille) 3px, transparent 3.5px) 0 0 / 10px 10px; }
  #ptt .led { background: var(--grille); }
  #ptt .tag { font: 600 13px/1.35 var(--sans); color: #cbbfcc; width: 3.6em; }
  #ptt .word, #ptt .say { margin-left: auto; height: 76px; min-width: 150px; flex: 1; max-width: 220px; border-radius: 999px; display: grid; place-items: center;
    font: 700 30px/1 var(--serif); letter-spacing: .12em; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, var(--brand-hi), var(--brand)); box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 8px 20px rgba(255,122,26,.4); }
  #ptt .say, #ptt .meter { display: none; }
  #ptt.on .tag, #ptt.on .word, #ptt.on .grille { display: none; }
  #ptt.on .say { display: grid; background: var(--tx); box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 8px 20px rgba(255,61,90,.45); }
  #ptt.on .meter { display: flex; flex: 1; gap: 3px; height: 30px; align-items: center; }
  .meter i { flex: 1; height: 40%; border-radius: 2px; background: var(--rx); opacity: .25; }
  .meter i:nth-child(n+6) { height: 60%; } .meter i:nth-child(n+10) { height: 80%; background: var(--c3); } .meter i:nth-child(n+13) { height: 100%; background: var(--tx); }
  .meter i.on { opacity: 1; }
  #ptt:disabled .tag { display: none; }
  #ptt:disabled .word { font: 600 14px/1.3 var(--sans); letter-spacing: 0; white-space: normal; text-align: center; padding: 0 14px; max-width: none;
    background: var(--grille); color: #e6dbe4; box-shadow: none; height: 60px; }

  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input { flex: 1; min-width: 0; font: 500 16px var(--sans); padding: 0 18px; height: 52px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
  .row input::placeholder { color: var(--ink3); }
  .row input:focus { outline: 0; border-color: var(--brand); }
  .row button { padding: 0 20px; height: 52px; flex: none; white-space: nowrap; background: var(--ink); color: #fff; }
  h2 { font: 700 21px/1.3 var(--serif); letter-spacing: -.02em; margin: 26px 4px 12px; }
  .note { color: var(--ink2); font: 500 14px/1.5 var(--sans); margin: 8px 4px 0; }
  .note:empty { display: none; }
  #leave { margin-top: 18px; color: var(--ink2); }

  /* 무전 카드: 둥근 핀. 왼쪽 물든 칸에 마스코트, 보낸 이 칩·작은 파형·시각, 오른쪽 아래 스피커 그릴 */
  #cards { display: grid; gap: 12px; }
  .card { --c: var(--brand); display: flex; position: relative; background: var(--paper); border: 1.5px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
  .card .face { width: 76px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 13%, #fff); }
  .cuckoo { object-fit: contain; flex: none; }
  .card .cuckoo { width: 60px; height: 60px; }
  .card .body { flex: 1; min-width: 0; padding: 12px 14px 22px; }
  .card .rx { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; font: 700 12px/1.2 var(--sans); color: var(--ink2); letter-spacing: .02em; }
  .card .rx > * { white-space: nowrap; flex: none; }
  .card .from { color: #fff; background: var(--c); border-radius: 999px; padding: 3px 10px; font-weight: 800; }
  .card .from.dark { color: var(--ink); }
  .card .wave { display: flex; align-items: center; gap: 2px; height: 16px; }
  .card .wave i { width: 3px; border-radius: 2px; background: var(--c); opacity: .85; }
  .card.fresh .wave i { animation: crackle .14s 10; }
  @keyframes crackle { 50% { transform: scaleY(.3); } }
  .card.fresh { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(-6px); opacity: .4; } }
  .card time { margin-left: auto; color: var(--ink3); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .text { font: 800 19px/1.35 var(--sans); letter-spacing: -.02em; margin-top: 7px; word-break: keep-all; overflow-wrap: anywhere; padding-right: 8px; }
  .card .grille { position: absolute; right: 12px; bottom: 9px; width: 50px; height: 10px; }
  .card.alert { border: 2.5px solid var(--tx); }
  .card.alert .text { color: var(--tx-ink); }
  .chip { display: inline-block; border-radius: 999px; padding: 3px 9px; font-weight: 800; color: #fff; background: var(--c4); }
  .chip.kids { background: var(--c6); }

  /* 긴급: 빨간 화면 전체, 흰 카드에 내용 */
  #sos { position: fixed; inset: 0; background: var(--tx); display: none; flex-direction: column; justify-content: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 1000; gap: 18px; color: #fff; }
  #sos .head { display: flex; align-items: center; justify-content: center; gap: 12px; font: 700 34px/1 var(--serif); }
  #sos .led { animation: blink .84s infinite; width: 16px; height: 16px; background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.3), 0 0 16px #fff; }
  #sos .lcd { background: var(--paper); color: var(--ink); border-radius: 28px; padding: 18px 20px; box-shadow: 0 16px 40px rgba(90,0,20,.3); }
  #sos .lcd b { display: inline-block; font: 800 13px/1.3 var(--sans); letter-spacing: .06em; color: #fff; background: var(--tx); border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; }
  #sos p { font: 800 22px/1.4 var(--sans); letter-spacing: -.02em; margin: 0; color: var(--tx-ink); word-break: keep-all; }
  #sos button { height: 64px; font: 700 22px/1 var(--serif); letter-spacing: .1em; background: var(--ink); color: #fff; box-shadow: 0 10px 24px rgba(42,34,48,.3); }
  #sos .cuckoo { width: 132px; height: 132px; align-self: center; border-radius: 12px; box-shadow: 0 10px 30px rgba(90,0,20,.25); }
  @media (prefers-reduced-motion: reduce) { .led.tx, .card.fresh, .card.fresh .wave i { animation: none; } }
</style>
</head>
<body>
<header>
  <span id="flag"></span>
  <img class="cuckoo" src="/cuckoo/base.svg" alt="">
  <h1>뻐꾸기</h1>
  <span id="status">휴대폰으로 함께 가기</span>
</header>

<section id="join" class="radio">
  <div class="slots"><img class="cuckoo" data-mood="wait" alt=""></div>
  <label for="code">받은 방 코드</label>
  <div class="lcd chan"><b>CH</b><input id="code" type="text" inputmode="text" autocomplete="off" maxlength="8" placeholder="ABC234"></div>
  <label class="check"><input id="agree" type="checkbox">
    <span>방에 있는 동안 휴대폰 위치를 일행과 나누는 데 동의합니다. 방을 나가면 위치를 보내지 않습니다.</span></label>
  <button id="go" class="big" disabled>들어가기</button>
  <button id="fleet" class="big ghost" style="display:none">운수사 방 새로 만들기</button>
</section>

<section id="room" style="display:none">
  <section id="vote">
    <label>쉬어 가 투표 <span class="lcd" id="left"></span></label>
    <div class="opts" id="opts"></div>
  </section>
  <div id="map"></div>
  <button id="ptt"><span class="grille"></span><span class="led" id="pttLed"></span><span class="tag">누르고 말하기</span><span class="word">무전</span><span class="meter" id="meter"></span><span class="say">TX</span></button>
  <div class="note" id="heard"></div>
  <div class="row">
    <input id="text" type="text" placeholder="글로 보내기" maxlength="200">
    <button id="send">보내기</button>
  </div>
  <a id="report" class="ghost" target="_blank" rel="noopener" style="display:none">차량별 운행 보고서 열기</a>
  <h2>무전</h2>
  <div id="cards"><div class="note">일행의 자동 콜과 무전이 여기에 뜹니다.</div></div>
  <button id="leave" class="ghost">나가기</button>
</section>

<section id="sos"><img class="cuckoo" data-mood="emergency" alt="">
  <div class="head"><span class="led"></span>긴급 콜</div>
  <div class="lcd"><b id="sosHead">EMERGENCY</b><p id="sosText"></p></div>
  <button id="sosOk">확인</button></section>

<script>
const $ = id => document.getElementById(id);

// 상단 막대 색은 바탕색 토큰을 따른다
document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
const CODE_RE = /^[A-HJ-NP-Z2-9]{6,8}$/;
let ws = null, me = null, last = null, watch = null, posTimer = null, vote = null, voteTimer = null, retry = 0, code = null;

// 주소에 ?code=ABC234 가 있으면 미리 넣는다
$('code').value = new URLSearchParams(location.search).get('code') || '';
// /control 은 운수사 관제석: 차로 세지 않고 위치를 보내지 않는다. 관제 키는 주소 # 뒤에 둔다(서버로 가지 않게)
const CONTROL = location.pathname === '/control';
let controlKey = new URLSearchParams(location.hash.slice(1)).get('key') || '';
if (CONTROL) {
  $('status').textContent = '운수사 관제석';
  $('agree').closest('label').style.display = 'none';
  $('fleet').style.display = 'block';
  $('go').textContent = '관제석으로 들어가기';
}
const ready = () => { $('go').disabled = !(CODE_RE.test($('code').value.trim().toUpperCase()) && (CONTROL ? controlKey : $('agree').checked)); };
$('code').oninput = ready; $('agree').onchange = ready; ready();

$('fleet').onclick = async () => {
  const r = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fleet: true }) });
  const j = await r.json();
  controlKey = j.controlKey;
  $('code').value = j.code;
  history.replaceState(null, '', `/control?code=${j.code}#key=${controlKey}`);
  ready();
};

$('go').onclick = () => { code = $('code').value.trim().toUpperCase(); if (!CONTROL) startGps(); connect(); };
$('leave').onclick = () => { code = null; ws?.close(); stopGps(); location.reload(); };

// 다시 붙을 때 같은 호차로 앉도록 서버가 준 재입장 토큰을 방마다 들고 있는다
function savedToken() { try { return sessionStorage.getItem(`token:${code}`) || undefined; } catch { return undefined; } }

function connect() {
  if (!code) return;
  $('status').textContent = '연결 중…';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/rooms/${code}/ws`);
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify(CONTROL ? { type: 'hello', role: 'control', key: controlKey } : { type: 'hello', nickname: '휴대폰', seats: [{ id: 'driver', occupied: true }], token: savedToken() })); };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
  ws.onclose = () => {
    if (!code) return;
    const d = Math.min(30, 2 ** retry++);
    $('status').textContent = `끊김, ${d}초 뒤 다시 연결`;
    setTimeout(connect, d * 1000);
  };
}

function send(o) { if (ws?.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }

// --- 위치: 2초마다 마지막 값 ---
function startGps() {
  if (!navigator.geolocation) return card('뻐꾸기', '이 브라우저는 위치를 쓸 수 없습니다', true);
  watch = navigator.geolocation.watchPosition(p => {
    last = { lat: p.coords.latitude, lng: p.coords.longitude, heading: p.coords.heading || 0, speed: (p.coords.speed || 0) * 3.6 };
    if (me) drawMap();
  }, err => card('뻐꾸기', `위치를 받지 못했습니다: ${err.message}`, true), { enableHighAccuracy: true });
  posTimer = setInterval(() => last && send({ type: 'pos', ...last }), 2000);
}
function stopGps() { if (watch != null) navigator.geolocation.clearWatch(watch); clearInterval(posTimer); }

// --- 받은 메시지 ---
// 서버 logic.js distText·앱 Phrase.distance 와 같다
const dist = m => m < 1000 ? `${Math.floor(m / 100) * 100}m` : m < 10000 ? `${(Math.round(m / 100) / 10).toFixed(1).replace(/\.0$/, '')}km` : `${Math.round(m / 1000)}km`;
// 앱 Phrase.signal 과 같은 문장. where 는 "1.2km 앞"
function signalText(m, where) {
  const d = m.distanceM != null ? `${dist(m.distanceM)} 앞 ` : '';
  switch (m.kind) {
    case 'brake_hard': return [m.from, where].filter(Boolean).join(', ') + ' 급제동, 감속하세요';
    case 'rain': return [m.from, where && `${where}부터`].filter(Boolean).join(', ') + ' 비';
    case 'turn_left': case 'turn_right': return `선두, ${d}${m.kind === 'turn_left' ? '좌회전' : '우회전'}`;
    case 'speed_limit': return `선두, 제한속도 ${m.value ?? '?'}으로 바뀜`;
    case 'caution': return `선두, ${d}주의 구간`;
    case 'airbag': return `긴급, ${m.from} 에어백 전개` + (where ? `, ${where}` : '');
  }
  return `${m.from} ${m.kind}`;
}
function haversine(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 12_742_000 * Math.asin(Math.sqrt(x));
}

function onMsg(m) {
  switch (m.type) {
    case 'welcome':
      me = m.carLabel;
      if (m.token) try { sessionStorage.setItem(`token:${code}`, m.token); } catch {}
      (m.cars || []).forEach(c => { cars[c.from] = { color: c.flagColor, lat: c.lat, lng: c.lng }; });
      setTimeout(() => { map?.invalidateSize(); drawMap(); }, 0);
      $('join').style.display = 'none'; $('room').style.display = 'block';
      if (m.role === 'control') {
        $('report').href = `/api/rooms/${code}/report?key=${encodeURIComponent(controlKey)}`;
        $('report').style.display = 'block';
        card('관제', `기사들에게 방 코드 ${code}를 알려 주세요. 관제석은 차로 세지 않습니다`, false, 'all', 'base');
      }
      showChannel();
      if (m.carNum) { document.documentElement.style.setProperty('--flag', carColor(m.carNum)[0]); $('flag').style.display = 'block'; }
      break;
    case 'hello': cars[m.from] = { ...cars[m.from], color: m.flagColor }; drawMap(); showChannel(); break;
    case 'pos': cars[m.from] = { ...cars[m.from], lat: m.lat, lng: m.lng }; drawMap(); break;
    case 'leave': delete cars[m.from]; drawMap(); showChannel(); break;
    case 'signal': {
      // 서버가 받는 쪽 기준 거리·앞뒤(gapM, ahead)를 붙여 준다. 없으면 직접 잰 거리만
      const where = m.gapM != null ? `${dist(m.gapM)} ${m.ahead ? '앞' : '뒤'}`
        : last && m.lat != null ? `${dist(haversine(last.lat, last.lng, m.lat, m.lng))} 거리` : '';
      const text = signalText(m, where);
      card(m.from, text, m.kind === 'brake_hard' || m.kind === 'airbag', 'all',
        { brake_hard: 'brake', airbag: 'emergency', rain: 'rain', speed_limit: 'camera', caution: 'camera' }[m.kind] || 'rx');
      if (m.lat != null) addPin(m.kind, m.from, m.lat, m.lng);
      if (m.kind === 'airbag') {
        $('sosHead').textContent = `EMERGENCY · ${m.from} 에어백`;
        $('sosText').textContent = text + (m.lat != null ? ` (${m.lat.toFixed(4)}, ${m.lng.toFixed(4)})` : '');
        $('sos').style.display = 'flex';
      }
      speak(text);
      break;
    }
    case 'notice':
      card('위치', m.text, m.kind === 'fall_behind' || m.kind === 'long_stop', 'all',
        { fall_behind: 'lost', long_stop: 'alert', place: 'arrive' }[m.kind] || 'base');
      speak(m.text);
      if (m.kind === 'fall_behind' && m.lat != null) addPin(m.kind, m.target, m.lat, m.lng);
      break;
    case 'say':
      card(m.system ? '꼬리 콜' : m.from === 'server' ? '뻐꾸기' : m.from + (m.speaker ? ` ${m.speaker}` : ''), m.text, false, m.channel, m.system ? 'alert' : m.channel === 'kids' ? 'kids' : m.from === me ? 'tx' : 'rx');
      if (m.from !== me) speak(`${m.from === 'server' ? '뻐꾸기' : m.from}, ${m.text}`);
      break;
    case 'roll': {
      const on = (m.seats || []).filter(s => s.occupied).length;
      card(m.from, `점호: ${on}명`, false, 'all', 'rollcall');
      break;
    }
    case 'route': card(m.from, `대장 콜: ${m.dest?.name || '목적지'}로 경로를 바꿨습니다`, false, 'all', 'rx'); speak(`선두가 ${m.dest?.name || '목적지'}로 경로를 바꿨습니다`); break;
    case 'vote_open': if (CONTROL) card('쉬어 가', '기사들이 휴게소 투표 중', false, 'all', 'vote'); else openVote(m); break;
    case 'vote_result':
      closeVote();
      card('쉬어 가', `${m.winner.name}, 총 ${m.totalPeople}명`, false, 'all', 'rest');
      speak(`${m.winner.name}, 총 ${m.totalPeople}명`);
      break;
    case 'arrive': card('뻐꾸기', '일행이 모두 도착했습니다', false, 'all', 'arrive'); speak('일행이 모두 도착했습니다'); break;
    case 'error': card('서버', m.error, true); break;
  }
}

// 마스코트 그림: 여섯 장(SVG)에 상황을 나눠 싣는다(앱 Mood 와 같은 짝)
// 표정마다 움직이는 픽셀 SVG(design/character/anim). 송신은 무전 중 그림, 대기는 기본 그림을 쓴다
const MOOD_FILE = { tx: 'talk', wait: 'base' };
function moodImg(img, m) { img.src = `/cuckoo/${MOOD_FILE[m] || m}.svg`; }
document.querySelectorAll('img[data-mood]').forEach(i => moodImg(i, i.dataset.mood));
// 호차 색 [바탕, 글자]: 1~6호차가 차례로 돌아간다. 3호차 노랑 위에는 어두운 글자
const carColor = n => [`var(--c${(n - 1) % 6 + 1})`, (n - 1) % 6 === 2 ? 'var(--ink)' : '#fff'];
function card(from, text, alert = false, channel = 'all', mood = null) {
  const c = document.createElement('div');
  c.className = 'card fresh' + (alert ? ' alert' : '');
  setTimeout(() => c.classList.remove('fresh'), 1500);
  mood ??= alert ? 'alert' : channel === 'kids' ? 'kids' : 'base';
  const n = parseInt(from);
  c.style.setProperty('--c', alert ? 'var(--tx)' : n > 0 ? carColor(n)[0] : channel === 'kids' ? 'var(--c6)' : 'var(--brand)');
  const t = new Date().toTimeString().slice(0, 8);
  const chip = channel && channel !== 'all' ? `<span class="chip${channel === 'kids' ? ' kids' : ''}">${channel === 'kids' ? '키즈' : '어른'} 채널</span>` : '';
  const wave = Array.from({ length: 6 }, () => `<i style="height:${30 + Math.random() * 70}%"></i>`).join('');
  c.innerHTML = `<div class="face"><img class="cuckoo" alt=""></div><div class="body"><div class="rx"><span>${mood === 'tx' ? 'TX' : 'RX'}</span><span class="from${!alert && n > 0 && carColor(n)[1] !== '#fff' ? ' dark' : ''}"></span>${chip}<span class="wave">${wave}</span><time>${t}</time></div><div class="text"></div></div><i class="grille"></i>`;
  moodImg(c.querySelector('img'), mood);
  c.querySelector('.from').textContent = from;   // 받은 글은 textContent 로만 넣는다
  c.querySelector('.text').textContent = text;
  const box = $('cards');
  if (box.firstElementChild?.classList.contains('note')) box.innerHTML = '';
  box.prepend(c);
  while (box.children.length > 50) box.lastElementChild.remove();
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR';
  speechSynthesis.speak(u);
}

// --- 일행 지도: 손대지 않아도 일행이 다 들어오게 맞춘다 ---
const PIN_TTL_MS = 5 * 60_000;
// 핀 글자. 색은 CSS .pin.<kind>
const PIN = { brake_hard: '급', rain: '비', turn_left: '좌', turn_right: '우', speed_limit: '속', caution: '주', airbag: '!', fall_behind: '이' };
let cars = {}, pins = [], map = null, carLayer = null, pinLayer = null;
if (window.L) {
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView([37.454, 127.043], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '&copy; OpenStreetMap' }).addTo(map);
  carLayer = L.layerGroup().addTo(map); pinLayer = L.layerGroup().addTo(map);
  setInterval(drawMap, 10_000); // 오래된 핀을 지운다
} else $('map').style.display = 'none';

function addPin(kind, from, lat, lng) { pins.push({ kind, from, lat, lng, at: Date.now() }); drawMap(); }

function drawMap() {
  if (!map) return;
  pins = pins.filter(p => Date.now() - p.at < PIN_TTL_MS);
  pinLayer.clearLayers(); carLayer.clearLayers();
  const pts = []; // 차와 이슈 핀이 모두 들어오게 맞춘다
  for (const p of pins) {
    pts.push([p.lat, p.lng]);
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="pin ${p.kind}">${PIN[p.kind] || '?'}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) }).addTo(pinLayer);
  }
  // 물방울 핀: 끝이 좌표를 가리킨다
  const put = (label, num, lat, lng, mine) => {
    pts.push([lat, lng]);
    const [bg, fg] = carColor(num);
    const html = `<div class="car${mine ? ' me' : ''}"><b style="background:${bg};color:${fg}"><i>${num}</i></b><span>${mine ? '나 · ' + label : label}</span></div>`;
    L.marker([lat, lng], { zIndexOffset: mine ? 1000 : 500, icon: L.divIcon({ className: '', html, iconSize: [80, 70], iconAnchor: [40, mine ? 51 : 42] }) }).addTo(carLayer);
  };
  for (const [label, c] of Object.entries(cars)) if (label !== me && c.lat != null) put(label, parseInt(label), c.lat, c.lng, false);
  if (last && me) put(me, parseInt(me), last.lat, last.lng, true);
  if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
  else if (pts.length === 1) map.setView(pts[0], 14);
}

// --- 쉬어 가 ---
function openVote(m) {
  vote = { deadline: Date.now() + (m.timeoutMs || 30000), mine: null };
  const box = $('opts'); box.innerHTML = '';
  m.candidates.forEach((c, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<b>${i + 1}</b>`; b.append(c.name);
    b.onclick = () => { if (vote.mine == null && send({ type: 'vote', choice: i })) { vote.mine = i; b.classList.add('mine'); } };
    box.append(b);
  });
  $('vote').style.display = 'block';
  clearInterval(voteTimer);
  voteTimer = setInterval(() => { $('left').textContent = `${Math.max(0, Math.round((vote.deadline - Date.now()) / 1000))}초`; }, 500);
  card('쉬어 가', '투표를 엽니다. ' + m.candidates.map((c, i) => `${i + 1}번 ${c.name}`).join(', '), false, 'all', 'vote');
}
function closeVote() { clearInterval(voteTimer); $('vote').style.display = 'none'; vote = null; }

// --- 받아 적기: 누르는 동안 듣고 떼면 보낸다 ---
function say(text) {
  text = text.trim(); if (!text) return;
  const n = text.match(/([1-3]|일|이|삼)\s*번/);
  if (vote && vote.mine == null && n) {
    const i = { '일': 0, '이': 1, '삼': 2 }[n[1]] ?? Number(n[1]) - 1;
    const b = $('opts').children[i];
    if (b) return b.click();
  }
  send({ type: 'say', text: text.length > 40 ? (text.match(/^[^.?!\n]+[.?!]/)?.[0] || text) : text, channel: 'all', seat: 'driver', speaker: '휴대폰' });
}
$('send').onclick = () => { say($('text').value); $('text').value = ''; };
$('text').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, heard = '';
if (!SR) { $('ptt').disabled = true; $('ptt').querySelector('.word').textContent = '음성 인식 없음 · 글로 보내기'; }
function pttDown(e) {
  e.preventDefault();
  if (!SR || rec) return;
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; heard = '';
  rec.onresult = ev => { heard = Array.from(ev.results).map(r => r[0].transcript).join(''); $('heard').textContent = heard; };
  rec.onerror = ev => { $('heard').textContent = `음성 인식 오류: ${ev.error}`; };
  rec.onend = () => { say(heard); rec = null; $('ptt').classList.remove('on'); $('pttLed').className = 'led'; stopMeter(); };
  rec.start();
  $('ptt').classList.add('on'); $('pttLed').className = 'led tx'; startMeter();
}
function pttUp() { rec?.stop(); }
$('ptt').addEventListener('pointerdown', pttDown);
$('ptt').addEventListener('pointerup', pttUp);
$('ptt').addEventListener('pointercancel', pttUp);
$('ptt').addEventListener('pointerleave', pttUp);

// 마이크 크기 미터: 누르는 동안만 마이크를 따로 열어 잰다. 못 열면 미터만 빈 채로 둔다
$('meter').innerHTML = '<i></i>'.repeat(16);
let meterStop = null;
async function startMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize), bars = [...$('meter').children];
    let raf;
    const tick = () => {
      an.getByteTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + ((v - 128) / 128) ** 2, 0) / buf.length);
      const n = Math.min(16, Math.round(rms * 64));
      bars.forEach((b, i) => b.classList.toggle('on', i < n));
      raf = requestAnimationFrame(tick);
    };
    tick();
    meterStop = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); ac.close(); bars.forEach(b => b.classList.remove('on')); };
  } catch { meterStop = null; }
}
function stopMeter() { meterStop?.(); meterStop = null; }

// 머리의 채널 LCD: 방 코드, 신호 막대, 일행 수 칸
function showChannel() {
  const n = Object.keys(cars).filter(k => k !== me).length + 1;
  const on = ws?.readyState === 1;
  const bars = [0, 1, 2, 3].map(i => `<rect x="${i * 5.5}" y="${12 - i * 4}" width="4" height="${4 + i * 4}" fill="currentColor" opacity="${on ? 1 : (i < 1 ? 1 : .25)}"/>`).join('');
  // 좁은 화면이라 일행 수 대신 우리 호차를 채널 LCD 안에 둔다(일행 수는 지도에서 보인다)
  $('status').innerHTML = `<span class="led${on ? ' rx' : ''}"></span><span class="lcd"><small>CH</small>${code}<svg viewBox="0 0 22 16" aria-hidden="true">${bars}</svg><span class="me"></span></span>`;
  $('status').querySelector('.me').textContent = me || `${n}대`;
}

$('sosOk').onclick = () => { $('sos').style.display = 'none'; };
</script>
</body>
</html>
