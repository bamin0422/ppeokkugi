  <path d="M 40 75 Q 42 68 40 62" stroke="#C8AA82" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 46 75 Q 48 67 46 61" stroke="#C8AA82" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 52 75 Q 54 68 52 62" stroke="#C8AA82" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- right wing -->
  <ellipse cx="149" cy="115" rx="11" ry="25" fill="#8AAFC4" transform="rotate(12 149 115)"/>
