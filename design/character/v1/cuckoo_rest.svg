    <rect x="74" y="119" width="58" height="4" rx="2" fill="#C8AA82" opacity="0.6"/>
    <rect x="74" y="131" width="58" height="4" rx="2" fill="#C8AA82" opacity="0.6"/>
    <rect x="74" y="143" width="58" height="4" rx="2" fill="#C8AA82" opacity="0.6"/>
  </g>
  <!-- neck -->
  <ellipse cx="104" cy="96" rx="20" ry="13" fill="#6B8FA8"/>
  <!-- head -->
  <circle cx="106" cy="68" r="32" fill="#6B8FA8"/>
  <ellipse cx="106" cy="50" rx="24" ry="18" fill="#4E6E84"/>
