  <circle cx="114" cy="8" r="5.5" fill="#E03040"/>
  <circle cx="112" cy="6" r="2" fill="#F06878" opacity="0.7"/>
  <!-- eyes closed -->
  <path d="M 86 67 Q 94 61 102 67" stroke="#F0C040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 108 65 Q 117 58 126 65" stroke="#F0C040" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- beak closed -->
  <path d="M 128 73 L 145 78 L 128 83 Z" fill="#E89820"/>
  <path d="M 128 73 L 145 78 L 136 75 Z" fill="#F0AA30" opacity="0.8"/>

